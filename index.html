all three. We need to use them where it counts.\"", "Nathan looked between the two containers — the empty one and the full one, one spent and one waiting.", "\"So we go for the third,\" he said.", "Voss nodded. \"We go for the third.\""], "scene_break": false, "chapter_number": 4, "chapter_title": "Lake Harrow", "first_in_chapter": false}, {"type": "chapter", "number": 5, "title": "Blackpoint Bay"}, {"type": "content", "paragraphs": ["The third site wasn't a lake or a reservoir. It was the ocean itself, off the coast near what used to be called **Blackpoint Bay** — miles of open water, sealed off and patrolled the same way everything else had been since the barricades went up, except here there was no shoreline to retreat to if something went wrong. Just black water stretching to a horizon that no longer looked like a horizon at all."], "scene_break": true, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": true}, {"type": "content", "paragraphs": ["\"This one's different,\" Voss said, checking her gear one last time on the boat that had ferried them out. \"Deeper, wider, no walls to work with. If something's down there, we won't have anywhere to run.\"", "\"Comforting,\" Nathan muttered, echoing something he'd said what felt like a lifetime ago."], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["They dropped in together, the surface vanishing almost instantly the way it always did, the Devil's Light cutting its narrow beam into a dark that felt somehow larger out here — less contained, less like a lake with an end to it.", "They found the ship faster than either of them expected, its silhouette rising out of the silt in the same familiar shape — rounded hull, jagged fins, a tear along its side.", "\"There,\" Voss said, already swimming toward it. \"Same as the others.\""], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Inside, the corridor curved the same way, the debris drifted the same way, the darkness pressed in the same way — until they reached the cockpit, and everything stopped feeling familiar at all.", "Nathan's light swept the chamber and caught it first.", "\"Voss.\"", "She followed his beam, and her breath caught hard enough that Nathan heard it crackle through the comm."], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["The Vortex was there — but it wasn't whole. It hung in pieces, scattered pale fragments drifting slowly through the water like broken glass, each one dimmer than it should have been, flickering weakly instead of pulsing steady. Something had torn through it, jagged gashes cutting clean across what should have been a single, unbroken mass.", "\"That's not decay,\" Voss said quietly, drifting closer to one of the larger fragments. \"Look at the edges. That's not wear, that's not age. Something *did* this.\"", "\"On purpose?\""], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Nothing does that by accident.\" Voss's light swept the rest of the cockpit, searching the shadows at its edges, tension coiling through every movement now. \"Something got in here. Found it. Destroyed it before we could.\"", "Nathan felt his stomach drop. \"Is it still down here?\"", "Voss didn't answer that. She moved quickly, pulling the sample container from her belt and carefully gathering the fragments, one by one, sealing them inside — dimmer, weaker, but still faintly glowing, still salvageable even broken."], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Whatever's left, we're taking it,\" she said. \"We don't leave anything down here for it to finish the job.\"", "The last fragment sealed inside, she snapped the container shut and looked to Nathan.", "\"Up. Now.\"", "They didn't wait to see if anything answered the disturbance. They swam hard for the tear in the hull, the open water beyond it feeling wider and darker than it had on the way down, until finally the gray smear of surface light broke through above them."], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Walker was waiting the moment they climbed aboard the boat, and his expression shifted the instant he saw the third container — cracked light flickering weakly inside instead of the steady glow the first two had carried.", "\"What happened out there?\" he asked.", "\"Someone got to it before us,\" Voss said, setting the container down carefully, hands still trembling from the dive. \"The third Vortex — it was in pieces. Torn apart, deliberately, inside the wreck.\""], "scene_break": true, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Deliberately,\" Walker repeated. \"You're telling me something destroyed it on purpose.\"", "\"I'm telling you nothing tears something apart like that by accident,\" Voss said. \"Clean gashes. Focused damage. Whatever did this knew exactly what it was looking at, and knew exactly what it wanted to stop.\"", "Walker's jaw tightened, glancing between the fractured glow in the container and the black water still churning gently behind the boat. \"So it knows what these things do.\""], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"It has to.\" Voss's voice was tight, exhaustion and something colder tangled together underneath it. \"Nothing else explains going after one specifically, out of everything else down there it could have left untouched.\"", "\"Can it still be used?\" Walker asked. \"Broken like that?\"", "\"I don't know yet,\" Voss admitted. \"But I don't think we have the luxury of finding out slowly. If something down there is actively hunting these, then Blackpoint Bay might not be the only site that's already compromised.\""], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Nathan looked out at the black ocean stretching behind them, the scale of it suddenly feeling less like a barrier holding something in and more like something watching, patiently, for exactly this kind of mistake.", "\"So what do we do?\" he asked.", "Walker was quiet for a long moment, jaw set, before he finally spoke."], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"You get that thing back to your lab and figure out what's left in it,\" he said. \"And I'm doubling security on wherever you're keeping the other two. If something's smart enough to hunt these down, I'm not giving it a second chance.\""], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Back at Blackpoint Bay's shoreline, Voss knelt at the water's edge with the third container in her hands, the fractured pieces inside pulsing weak and uneven, nothing like the steady glow the first two had carried.", "\"We test it before we lose the chance,\" she said. \"If it's too damaged to work at all, better we know now.\"", "\"You think it's still going to do anything?\" Nathan asked. \"It's in pieces.\""], "scene_break": true, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"I don't know. But it's still glowing. That means there's something left.\" She opened the container carefully.", "The fragments didn't move with the same eager pull the first Vortex had shown. They drifted out slowly, hesitantly, some pieces lagging behind others as if struggling to hold together at all. When they finally touched the black water, the reaction came — but it didn't spread outward in a ring at all.", "It pulsed once, hard, and the change didn't happen *around* the fragments. It happened everywhere."], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Voss's radio crackled to life almost instantly, an officer's voice cutting through, breathless. \"Dr. Voss — we're getting reports. All stations, all sites — the water level's changed. Everywhere.\"", "\"Define changed,\" Voss said, already scanning the bay in front of her.", "\"The top layer,\" the voice said. \"Every body of water on record. The first two and a half meters — it's *clear*. Rivers, lakes, oceans. All of it, all at once.\""], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Nathan stared at the bay stretching out in front of them — still black beneath the surface, the deep of it swallowing light the same as ever, but the very top, the layer they could actually see and reach, sat clear and ordinary, rippling in the wind exactly the way water should."], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"It didn't clear a patch,\" Voss said slowly, working through it out loud. \"It cleared a *depth*. Everywhere at once. The first two and a half meters of every single body of water on Earth.\"", "\"That's...\" Nathan searched for the word. \"That's enormous.\""], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"It's a start,\" Voss said, though her voice carried something heavier than triumph. She looked down at the now-dark, spent fragments settling lifelessly in the container. \"Even broken, even crippled — it still reached the whole planet. Imagine what it would've done whole.\"", "The fragments dimmed the rest of the way and went dark for good, their purpose spent.", "Voss stood slowly, staring out at the strange, thin layer of ordinary water sitting over an entire world of black."], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Two and a half meters,\" she said. \"That's shallow enough to walk through. Wade through. Maybe even swim near the surface without ever touching what's underneath.\"", "Nathan looked at her. \"But everything below that—\"", "\"Is still exactly what it was,\" Voss finished. \"We didn't fix the ocean. We just... opened a door back to the surface.\""], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Back at the lab, the two remaining containers sat side by side on the workbench — the second Vortex, whole and steady, its glow deep and patient; and the spent husk of the third, dark now, its usefulness already spent.", "\"So that's it,\" Nathan said, looking between them. \"One left. And we don't actually know what it does until we use it.\""], "scene_break": true, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"We have theories,\" Voss said, though she didn't sound entirely convinced by her own words. \"The first cleared a small patch. The third — broken as it was — cleared a shallow layer across the entire planet. If the pattern holds—\"", "\"Then the second one, whole, could do one of two things,\" Nathan finished. \"Either it clears a much bigger patch somewhere. Or it does what the third one did, but properly. The whole planet, not just the surface.\""], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Voss stared at the container, turning the decision over slowly. \"There's no way to test that safely. Not on a scale that tells us anything without just... doing it.\"", "\"So we don't get to choose,\" Nathan said. \"We use it, and we find out which one it is at the same time.\""], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"That's the gamble.\" Voss picked up the container, holding it like it weighed more than it possibly could. \"If it's the local option, we've just spent our last chance clearing one more spot on a planet that's still drowning in this. If it's global—\"", "\"Then it's over,\" Nathan said quietly. \"Or at least, it's the closest thing to over we're going to get.\""], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Voss looked up at him. \"And if it's neither. If it does nothing at all, because whatever's down there has already figured out how to counter it, the way it counted the third one—\"", "\"Then we're no worse off than we already are,\" Nathan said. \"We have to try.\"", "Voss held the container a moment longer, staring into the deep, steady glow inside — the last one, whole, untouched, exactly the way her father must have finished it."], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Alright,\" she said finally. \"Let's go find out what you actually built, Dad.\""], "scene_break": false, "chapter_number": 5, "chapter_title": "Blackpoint Bay", "first_in_chapter": false}, {"type": "chapter", "number": 6, "title": "The Replication Machine"}, {"type": "content", "paragraphs": ["Before they risked the last whole Vortex on a gamble neither of them could take back, Voss had one more idea — buy themselves certainty instead of hope.", "\"We build something that can actually read it,\" she said, staring at the container. \"Not just react to it. *Understand* it. If we can scan it deeply enough, replicate even a fraction of what it's doing at a structural level, maybe we can predict the scale before we ever open the lid.\""], "scene_break": true, "chapter_number": 6, "chapter_title": "The Replication Machine", "first_in_chapter": true}, {"type": "content", "paragraphs": ["It became the only thing either of them worked on for months."], "scene_break": false, "chapter_number": 6, "chapter_title": "The Replication Machine", "first_in_chapter": false}, {"type": "content", "paragraphs": ["The lab expanded far beyond the original engineering room, absorbing three more down the hall as Voss pulled in specialists Walker had cleared through military channels — physicists, materials engineers, anyone with a background close enough to what her father had once worked in. Prototypes failed one after another. Scanners built to read the Vortex's structure came back with results that contradicted themselves, readings that made sense for a heartbeat before dissolving into noise the machines couldn't parse."], "scene_break": false, "chapter_number": 6, "chapter_title": "The Replication Machine", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"It's not that the technology can't handle it,\" Voss said one night, weeks in, staring bleary-eyed at yet another failed readout. \"It's that this thing doesn't behave like *matter*. Every scan we run assumes something stable to measure. This isn't stable. It's not *supposed* to be measurable the way we're trying to measure it.\"", "\"So build something that doesn't assume that,\" Nathan said.", "It took another two months after that."], "scene_break": false, "chapter_number": 6, "chapter_title": "The Replication Machine", "first_in_chapter": false}, {"type": "content", "paragraphs": ["The machine they finally built didn't look like anything either of them had sketched at the start — a hybrid of the shielded alloy circuitry, sensors borrowed from three different disciplines, and code Voss had rewritten from scratch more times than she could count. It could hold a tiny fragment of replicated Vortex material in a contained field, safe enough to observe without risking the real thing."], "scene_break": false, "chapter_number": 6, "chapter_title": "The Replication Machine", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Voss didn't sleep that night. Or the next.", "She tore the machine apart down to the shielded alloy core, spreading every line of code across three monitors, cross-referencing it against every scrap of her father's old research she'd managed to dig up from his archived files — half-finished notes, abandoned equations, theories he'd never published because no one would have believed them."], "scene_break": true, "chapter_number": 6, "chapter_title": "The Replication Machine", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"You're not going to find it faster by not sleeping,\" Nathan said, setting a cup of coffee down beside her for the third time that day, untouched from the last two.", "\"It's not the code,\" Voss muttered, not looking up. \"The replication itself worked, structurally. The fragment held its shape, reacted the way it should. But every time we try to scale it up, it collapses the second we add power.\"", "\"So give it more power.\""], "scene_break": false, "chapter_number": 6, "chapter_title": "The Replication Machine", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"I've tried everything we have. Grid power, battery banks, the alloy's own conductivity pushed as far as it'll go without melting the housing.\" She rubbed her eyes, exhaustion cracking her voice. \"None of it's enough. Whatever my father used to *make "That's exactly what I mean.\" Voss sat back, staring at the machine that had taken months to build, at the replication chamber that had never once succeeded because it had been missing the one ingredient they couldn't spare. \"Everything we tried to avoid — sacrificing the one we have left to build something new — that might be the only way any of this scales.\"", "She looked at the container, then back at Nathan."], "scene_break": false, "chapter_number": 6, "chapter_title": "The Replication Machine", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"We have one Vortex left in the world that actually works,\" she said. \"And the only way to make more of them... is to burn it.\""], "scene_break": false, "chapter_number": 6, "chapter_title": "The Replication Machine", "first_in_chapter": false}, {"type": "content", "paragraphs": ["They stood on either side of the machine for a long time before either of them moved.", "\"There has to be another way,\" Nathan said, though even he didn't sound convinced."], "scene_break": true, "chapter_number": 6, "chapter_title": "The Replication Machine", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"There isn't time to keep looking for one,\" Voss said quietly. \"Every day we wait, more of it spreads, more of whatever's down there gets stronger. We have one working Vortex and a machine that might be able to use it to make something new. If we don't try, we've just been holding onto it out of fear.\"", "She opened the container one last time."], "scene_break": false, "chapter_number": 6, "chapter_title": "The Replication Machine", "first_in_chapter": false}, {"type": "content", "paragraphs": ["The Vortex drifted free, glowing steady and deep, and for a moment it seemed almost reluctant, curling slowly in the air before settling into the machine's power core — not the replication chamber, Nathan realized, but the housing built specifically to feed it in as *fuel*.", "\"Once this starts,\" Voss said e}, {"type": "content", "paragraphs": ["For one brief moment, hope flickered across the lab.", "Then the screams kept coming.", "Voss watched the monitors, waiting for the tide of Abyssals to slow, to retreat, to *react* at all to what should have been a devastating strike against whatever they were made of.", "Nothing changed. The creatures kept coming, undisturbed by the newly cleared water around them, still surging through barricades, still tearing through everything in their path exactly as they had before."], "scene_break": false, "chapter_number": 7, "chapter_title": "The Breach", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"It didn't touch them,\" Voss said, disbelief and exhaustion crashing over her at once. \"It cleared ten meters of water across the entire planet, and they didn't even slow down.\"", "Nathan stared at the screens, the scale of what they'd just spent settling over him. \"So it's not a weapon against them at all.\""], "scene_break": false, "chapter_number": 7, "chapter_title": "The Breach", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"No,\" Voss said quietly, watching another barricade fail on-screen. \"It never was. It was only ever meant to fix the water.\" She looked at the empty containment unit, the second Vortex now completely spent for a result that solved a problem they didn't currently have time to care about. \"We just used our best shot on the wrong fight.\""], "scene_break": false, "chapter_number": 7, "chapter_title": "The Breach", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Nathan tore his eyes from the monitors. \"The harpoons. Voss, where are the harpoons?\"", "For a second she just stared at him, like the question hadn't fully landed through the noise of alarms and screaming radios.", "\"The trunk,\" she said, snapping back. \"Our vehicle — the case is still in the trunk, packed since Mirren. We never touched it after that.\""], "scene_break": true, "chapter_number": 7, "chapter_title": "The Breach", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Nathan was already moving, shoving past the officer still frozen at the door, out into the lot where their transport sat exactly where they'd left it. He wrenched the trunk open, and there it was — the long case, foam-lined, two launchers and a rack of harpoons untouched since the fight at the lake.", "He grabbed one, slung a bandolier of harpoons over his shoulder, and ran back toward the noise."], "scene_break": false, "chapter_number": 7, "chapter_title": "The Breach", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Outside the lab, the flooded intersection had gone from a test site to a battlefield in the span of a minute. Something long and pale was dragging itself up out of the water pooling against the curb, jaws already snapping toward a soldier who'd stumbled backward over a fallen barricade section.", "Nathan didn't think. He braced the launcher against his shoulder the way he'd watched Voss do it at Mirren, sighted down the barrel, and fired."], "scene_break": false, "chapter_number": 7, "chapter_title": "The Breach", "first_in_chapter": false}, {"type": "content", "paragraphs": ["The harpoon caught the creature clean through the side of its head. It shrieked — a wet, grinding sound — and thrashed once before going still, half-in and half-out of the water.", "\"Nathan!\" Voss's voice, from the doorway. \"Behind you!\"", "He spun, reloading on instinct, and put a second harpoon through something smaller but faster, all teeth and no eyes, that had been closing fast on his blind side. It dropped."], "scene_break": false, "chapter_number": 7, "chapter_title": "The Breach", "first_in_chapter": false}, {"type": "content", "paragraphs": ["The soldier he'd saved scrambled backward, staring up at him like he couldn't quite believe what had just happened. \"Where did you—\"", "\"Move!\" Nathan cut him off, already reloading again, watching the black
