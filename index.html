ht spilling from the wound like something bleeding out in reverse.", "Nathan's launcher clicked empty. \"That's it — I'm out!\""], "scene_break": false, "chapter_number": 10, "chapter_title": "The Sovereign's Throne", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"So am I.\" Voss backed against the wall beside him, breathing hard, watching the creature shake off the last hit and straighten, black smoke pouring from the wounds in its head but showing no sign of falling. \"We're out of everything. Harpoons, charge, Vortexes—\"", "The creature took another step toward them, slow now, deliberate, black light gathering thick around its clawed hands like it was preparing something far worse than a simple strike."], "scene_break": false, "chapter_number": 10, "chapter_title": "The Sovereign's Throne", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Nathan looked at the empty launcher in his hands, then at Voss, then at the creature closing the last of the distance between them.", "\"We're not out of everything,\" he said quietly. \"We're just out of what we brought.\"", "Nathan's eyes swept the chamber fast, searching for anything, and landed on the shattered throne — the black stone split clean down the middle where the creature had first emerged, and threaded through the crack, faint but unmistakable, the same dull gray sheen of shielded alloy."], "scene_break": false, "chapter_number": 10, "chapter_title": "The Sovereign's Throne", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Voss — the throne.\"", "\"What about it?\"", "\"It's not just stone. Look at the fracture.\" He was already moving, ducking under a wide swing that took a chunk out of the chamber wall behind him. \"It's got alloy running through it. The same stuff my father's tech was built from — the same stuff that survives the water.\""], "scene_break": false, "chapter_number": 10, "chapter_title": "The Sovereign's Throne", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Voss's eyes went wide with understanding. \"The Sovereign's whole throne was shielded the same way our gear is. That's not decoration — that's containment.\" She scrambled toward the wreckage as the creature turned, tracking Nathan instead, another black-wreathed strike crashing down where he'd been standing a half-second before. \"If it held something like *that* thing safely for who knows how long—\""], "scene_break": false, "chapter_number": 10, "chapter_title": "The Sovereign's Throne", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Then it's built to hold what we're fighting.\" Nathan wrenched a jagged shard of the throne free, the alloy vein running through its length humming faintly the moment his glove closed around it. \"Voss, incoming!\"", "She spun and fired her empty launcher out of pure reflex, the creature barely reacting to the empty click before its claws swept toward her. She threw herself sideways, rolling clear, snatching up a second broken piece of the throne as she came up."], "scene_break": false, "chapter_number": 10, "chapter_title": "The Sovereign's Throne", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"It doesn't fire,\" she said, breathless, \"but if the alloy resists whatever this thing's made of the same way it resists the water—\"", "\"Then it won't get absorbed like the harpoons did.\" Nathan planted his feet, gripping the shard like a blade instead of a gun. \"We stop shooting it. We stab it.\""], "scene_break": false, "chapter_number": 10, "chapter_title": "The Sovereign's Throne", "first_in_chapter": false}, {"type": "content", "paragraphs": ["The creature lunged again, and this time Nathan didn't dodge — he drove the alloy shard forward, catching it mid-strike, the point sinking into the black mass of its forearm. Instead of sealing over the way every other wound had, the flesh around the alloy *recoiled*, black light hissing away from the metal like it had been burned.", "The creature reared back, letting out a sound closer to a shriek than the low groan from before."], "scene_break": false, "chapter_number": 10, "chapter_title": "The Sovereign's Throne", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"It works!\" Voss shouted, already closing in from the other side, driving her own shard deep into its flank. Another hiss, another recoil, black smoke pouring from both wounds at once as the creature staggered between them."], "scene_break": false, "chapter_number": 10, "chapter_title": "The Sovereign's Throne", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Together! Same as the Sovereign!\" Nathan wrenched his shard free and drove it in again, lower this time, Voss mirroring the strike from the opposite side a half-second later. The creature's massive form shuddered, black light bleeding fast now from every wound they opened, unable to close a single one while the alloy remained anywhere near it.", "\"It can't heal around the metal!\" Voss called, ducking a wild, weakening swing. \"Nathan — the head! Same as before!\""], "scene_break": false, "chapter_number": 10, "chapter_title": "The Sovereign's Throne", "first_in_chapter": false}, {"type": "content", "paragraphs": ["He didn't need telling twice. He scrambled up the broken throne's base, launching himself at the creature's staggering shoulder, driving the alloy shard hard into the space just beneath where its skull should have been. Voss's shard found the same mark from the other side an instant later, both points sinking deep, meeting somewhere in the black at the creature's core.", "It didn't scream this time."], "scene_break": false, "chapter_number": 10, "chapter_title": "The Sovereign's Throne", "first_in_chapter": false}, {"type": "content", "paragraphs": ["It simply stopped — every ounce of black light it carried collapsing inward all at once, the massive form crumpling in on itself until there was nothing left standing in the ruined chamber but drifting motes of dark, fading one by one into the stone floor.", "Nathan hit the ground hard, chest heaving, the alloy shard still clenched white-knuckled in his hand. Across the wreckage, Voss sank to her knees, breathing just as hard, staring at the space where the creature had been."], "scene_break": false, "chapter_number": 10, "chapter_title": "The Sovereign's Throne", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Voss,\" Nathan managed. \"Tell me that's actually over.\"", "Voss didn't answer right away. She looked past him, toward the far wall of the chamber, where a narrow seam of black stone had begun, slowly, to split open — revealing a passage neither of them had noticed until just now, leading deeper down than anything they'd found so far.", "\"I don't think it is,\" she said quietly. \"I think we just found the door to whatever was actually behind all of this.\""], "scene_break": false, "chapter_number": 10, "chapter_title": "The Sovereign's Throne", "first_in_chapter": false}, {"type": "content", "paragraphs": ["The passage sloped downward, narrow and dark, the pulsing veins of light growing sparser the further they went until Voss finally clicked the Devil's Light back on, its beam cutting through a black that felt older, stiller, than anything they'd passed through above.", "\"How far down are we now?\" Nathan asked, voice low, though there was nothing left to hide from.", "\"I stopped tracking depth an hour ago,\" Voss admitted. \"We're well past anything the submersible's readings accounted for.\""], "scene_break": true, "chapter_number": 10, "chapter_title": "The Sovereign's Throne", "first_in_chapter": false}, {"type": "content", "paragraphs": ["The passage opened without warning into a wide chamber, and Voss's light swept across it before either of them fully processed what they were looking at.", "It looked like a lab."], "scene_break": false, "chapter_number": 10, "chapter_title": "The Sovereign's Throne", "first_in_chapter": false}, {"type": "chapter", "number": 11, "title": "Theodore's Lab"}, {"type": "content", "paragraphs": ["Workbenches lined the walls, cluttered with instruments that were unmistakably tools — not the alien architecture of the ship or the coliseum above, but shapes built for hands, for use, for the same kind of careful, methodical work Nathan had watched Voss do a hundred times over the last several months. Containment units sat in neat rows, most of them empty, a few still holding faint, dead glimmers of spent material. Diagrams covered one entire wall, dense and layered, notes scrawled in the margins in a hand that made Voss go very still the instant her light landed on them."], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": true}, {"type": "content", "paragraphs": ["\"That's...\" She took a step closer, disbelief bleeding into her voice. \"That's his handwriting.\"", "\"Your father's?\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"It has to be.\" She crossed the chamber fast, running her light over page after page of notes, equations she recognized instantly, sketches of alloy specifications identical to the ones she'd grown up watching him draw at their own kitchen table. \"This is his work. This is where he built it. All of it — the White Vortex, the Blue, the failsafe files—\" Her voice caught. \"He was *here*, Nathan. Not just theorizing from some office up above. He came all the way down here to do this.\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Nathan moved closer to the wall of diagrams, and something in the layering caught his eye — the handwriting shifting, subtly, partway through the notes. The careful, familiar script Voss had pointed out gave way, page by page, to something colder, more angular, pressed into the paper harder than a hand should need to press.", "\"Voss. Look at this.\"", "She followed his light, and her breath caught. \"That's not his.\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"It picks up right where his notes stop,\" Nathan said slowly, tracing the shift with his light. \"Like someone else found this place after he was gone. And kept going.\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Voss moved along the wall, faster now, reading the altered notes with growing horror. \"These are edits. Corrections. Whoever wrote this went through every one of my father's theories and *refined* them.\" She stopped at a final page, hand trembling as she held her light over it. \"This is where Variant B came from. Not just the file we found. This is where it started — down here, after he was already gone.\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"So the Sovereign didn't reverse-engineer your father's work from a distance,\" Nathan said quietly, the pieces falling into place. \"It found this lab. Found everything he'd already built. And used it.\"", "Voss stared at the workbench, at the dust-settled containment units, at six years of her father's absence turned into someone else's arsenal."], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"He didn't die and leave a warning behind,\" she said, voice hollow. \"He died, and something down here *took* everything he left unfinished.\" She looked at Nathan, something cold and furious settling into her exhaustion. \"Everything we've been fighting — the Abyssals, the clones, the black Vortex — some of it might genuinely be his work. Twisted into something he never would have allowed.\"", "Nathan looked around the chamber, at the scale of what had been built on top of one dead man's research."], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Then we finish it properly,\" he said. \"Not whatever the Sovereign turned it into. What he actually meant to build.\" Voss's light swept across the far wall of the lab, past the shifted handwriting, and stopped on something pinned beneath a heavy chunk of loose stone — a single sheet, far larger than the notebook pages scattered everywhere else, its edges brittle and curling.", "\"Nathan. Help me with this.\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Together they wrestled the stone aside, and the paper came free, unrolling across the nearest workbench under the dim pulse of the room's veined light. It was a diagram — dense, meticulous, but drawn in that same cold, angular script that had taken over the notes after Theodore Voss's handwriting stopped. Not his work. The Sovereign's.", "\"Violet,\" Voss said quietly, staring at the shaded rendering at the diagram's center."], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Nathan leaned in, tracing the notes surrounding it. Formulas, structural breakdowns, the same alloy specifications woven through every version they'd already seen — but the purpose written beneath it in that sharp, pressed script made his stomach drop.", "\"Origin Vortex — the source signature. What turns the water.\"", "\"That's not a cure,\" Nathan said slowly. \"That's not a weapon either.\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"No.\" Voss's hands hovered over the page without touching it, disbelief bleeding into every line of her face. \"This is the cause. This diagram is the thing that turns ordinary water into what we've been fighting since day one.\"", "\"Your father didn't build this.\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"No.\" Voss shook her head, scanning further down the page. \"He built the base principle — the fracture theory, the Vortex itself. But this—\" she gestured at the dense, deliberate notes, \"—this is someone taking his unfinished ideas and pointing them somewhere he never intended. He theorized fractures could exist. This is a diagram for opening one on purpose.\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["She kept reading, voice growing tighter. \"It's dated. Recent — recent compared to everything else down here. Whatever built this didn't inherit a finished weapon from my father. It took his theories about fractures and reverse-engineered a way to force one open across every body of water on Earth at once.\"", "\"So the water turning black wasn't an accident,\" Nathan said. \"It wasn't even something that happened to the world. It was built. On purpose. Down here.\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"By the Sovereign,\" Voss said, staring at the diagram like it was a confession that wasn't even hers to feel guilty over. \"Or whatever came before it wore that shape. This is the actual origin, Nathan. Not a natural disaster. Not fate. A weapon someone built using pieces of my father's work, aimed at the entire planet.\"", "Nathan stared at the diagram, at the small, violet-shaded mass at its center, drawn with the same careful precision as every other Vortex they'd learned to fear."], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"So somewhere down here,\" he said quietly, \"there's a working one. The thing that actually started all of this.\"", "Voss didn't answer right away. She rolled the paper carefully, tucking it against her chest like evidence."], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Then that's what we're here to finish,\" she said. \"Not just the Sovereign. Not just its army. The thing that made the water black in the first place.\" Voss stared at the diagram a long moment, something shifting behind her exhaustion — not dread this time, but the beginning of an idea.", "\"Wait.\" She unrolled the paper further, scanning the notes a second time, faster now. \"If this thing is what turned the water black in the first place—\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Then it's the opposite of everything we've built,\" Nathan said, following the thought. \"The white one reverses the water. This one causes it.\"", "\"Which means they're not separate problems.\" Voss's finger traced the diagram's core, the violet mass rendered with the same careful precision as every other Vortex they'd learned to fear. \"What if the Violet Vortex isn't just the origin. What if it's also the answer.\"", "Nathan looked at her, not quite following. \"You want to build the thing that started all of this.\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"I want to reverse it.\" Voss's voice picked up speed, excitement cutting through the fatigue for the first time in what felt like days. \"Every Vortex we've found does the opposite of what its counterpart does — blue kills what white reverses, red copies what blue destroys. If this diagram shows us the exact mechanism that turns water black, permanently, at the source—\"", "\"Then flipping it the same way you flipped the black water at Lake Mirren—\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Could undo the entire thing,\" Voss finished, staring at the page like it had transformed in her hands. \"Not two and a half meters. Not ten meters deep. The actual source signature. If we reverse this instead of just reacting to what it produces, we're not treating the wound anymore. We're closing it.\"", "Nathan felt something loosen in his chest for the first time since Blackpoint Bay — the faintest flicker of an ending that didn't involve more fighting."], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Can you actually build it?\" he asked. \"Reversed?\"", "Voss was already pulling a fresh sheet toward her, sketching fast, cross-referencing the Sovereign's cold, angular notes against the base principles she recognized as her father's. \"The structure's all here. I just need to invert the polarity of the reaction — same materials, same process, opposite output.\" She paused, pen hovering. \"It's going to need everything left in this lab. And it's not going to be fast.\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"We have time,\" Nathan said. \"We didn't come all this way to leave without trying.\"", "Voss looked up at him, then back down at the diagram — at the violet mass that had once been a weapon aimed at the entire planet, now maybe the only thing that could actually end it.", "\"Then let's get to work,\" she said. \"We're building a cure out of the thing that broke the world.\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["They took the submersible back up in near silence, the Violet Vortex diagram sealed carefully against water damage, riding in Voss's lap the entire ascent. By the time they broke the surface at the boathouse dock, dawn was breaking gray and thin over Blackpoint Bay — the first sunrise either of them had actually seen in longer than either wanted to count."], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Walker met them at the shore, exhaustion and disbelief tangled together on his face as Voss climbed out holding the rolled paper like it was the only thing keeping her upright.", "\"Tell me you found something,\" he said.", "\"We found the cause,\" Voss said. \"And maybe the cure. Same thing, reversed.\"", "Back at the lab, she spread the diagram across the main workbench, tracing through the full materials list with a growing frown."], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"This isn't simple,\" she said. \"It's not alloy and a compound ratio like the Blue Vortex was. Look at the base structure.\" She pointed to the diagram's core, where the violet mass wasn't drawn as a single material at all, but as three distinct signatures woven together into one. \"It's not built from scratch. It's a synthesis. White, blue, and red — combined, inverted, and stabilized into something new.\"", "Nathan's stomach sank. \"We don't have any of those left.\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"We have one.\" Voss was already crossing to the reinforced storage locker at the back of the lab, the one she hadn't opened in weeks. Inside, sealed and untouched, sat a single containment unit — the second White Vortex, the one recovered whole from Lake Harrow, kept back and never risked. \"This one. I never used it. Never fed it into the machine, never released it. It's been sitting here the whole time.\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Nathan stared at it, disbelief and relief tangled together. \"I thought we spent both of them.\"", "\"We spent the first one,\" Voss said. \"This is the one we pulled the day we decided to hold back instead of testing Harrow twice. I kept telling myself we might need it whole someday.\" She almost laughed, exhausted and hollow. \"I didn't know it would be for this.\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["She checked the rest of the inventory fast — every Blue Vortex containment unit accounted for and empty, every Red Vortex container the same, spent in the fight against the Sovereign's clones and the throne room battle.", "\"So we have the white,\" Voss said, setting the container carefully beside the diagram. \"That's one piece of three. We still need to build fresh blue and red, from scratch, in the right ratio.\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Walker, standing in the doorway, crossed his arms. \"So you need to go back down there.\"", "\"Not the white,\" Voss said. \"But yes — for the rest. We know how to make blue now, and we have a sample of the red signature recorded even without a working piece to spare. We're not starting from zero anymore. Just from two out of three.\"", "Nathan looked at the sealed White Vortex sitting on the workbench, steady and whole after everything they'd been through."], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Then let's not waste the one thing that's still on our side,\" he said.", "They hauled Voss's replication machine out from where it had sat dormant since the Sovereign's fall, the shielded alloy core still humming faintly the instant power ran through it again."], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"We already know the recipe,\" Voss said, pulling up the formula from the archive file one more time — the same one that had built the very first Blue Vortexes for the fight at Blackpoint. \"Alloy, the compound, the ratio. We just need enough raw material to make more than a handful this time.\"", "\"How many do we need?\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Voss checked the diagram's notes against her own calculations, running the numbers twice to be sure. \"The synthesis needs a full Blue Vortex, not fragments. One complete unit, same as the white.\"", "\"Then we build one clean,\" Nathan said, already sorting through the alloy stock still left from the last production run. \"Not five split thin like before. One, whole, and strong.\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["It took the better part of a day. Voss fed the compound into the machine in careful stages, monitoring the reaction as it stabilized, the chamber glowing a familiar cold blue as the structure took shape — steadier this time, without the rush and improvisation of the first batch.", "When it finished, a single Blue Vortex sat pulsing in the containment chamber, dense and whole, matching the strength of the very first one they'd carried into Blackpoint Bay."], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"That's two,\" Voss said, sealing it into its unit beside the White Vortex. \"Whole white, whole blue.\" She looked at the empty rack where the red containers used to sit. \"One left.\"", "Nathan glanced at the machine, still humming from the last build. \"Can it make a red one the same way?\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"That's the problem.\" Voss frowned at her notes. \"We built the blue ones from a formula my father left behind — alloy and compound, something we can source and shape ourselves. The red signature isn't like that. It's not human-made. Every one we ever had came out of something that crossed over — the Sovereign, the clones. We've never actually synthesized one from raw material.\"", "\"So we need another source.\""], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Voss stared at the machine, then at the diagram, the last piece of the puzzle sitting just out of reach.", "\"We need something like the Sovereign again,\" she said quietly. \"Or we need to find where it's actually made.\"", "The descent back to Theodore's lab felt different this time — not the desperate scramble of before, but a slower, more deliberate search, both of them combing through the wreckage of notes and diagrams with fresh eyes, looking specifically for anything about the red."], "scene_break": false, "chapter_number": 11, "chapter_title": "Theodore's Lab", "first_in_chapter": false}, {"type": "chapter", "number": 12, "title": "The Sovereign's Diary"}, {"type": "content", "paragraphs": ["It was Nathan who found it, tucked beneath a loose panel near the back wall — a slim, cracked journal, bound in the same dull alloy sheen as everything else down here, its pages filled edge to edge with the Sovereign's cold, angular script.", "\"Voss. This isn't research notes. This is a diary.\"", "She crossed the chamber fast, crouching beside him as he opened it carefully, the brittle pages nearly crumbling at the spine."], "scene_break": false, "chapter_number": 12, "chapter_title": "The Sovereign's Diary", "first_in_chapter": true}, {"type": "content", "paragraphs": ["The early entries were clinical, detached — observations about the lab, about Theodore Voss's abandoned equipment, a kind of inventory written in a tone that felt less like discovery and more like appraisal. But a few pages in, the writing shifted, growing longer, more consumed by a single subject."], "scene_break": false, "chapter_number": 12, "chapter_title": "The Sovereign's Diary", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"The human's work on the fracture principle is incomplete but promising,\" Voss read aloud, voice tight. \"His Vortex reverses. Mine will not merely fail to reverse — mine will resist reversal entirely. A signature born not from repair, but from conquest.\"", "\"That's the red,\" Nathan said quietly.", "Voss kept reading, flipping pages faster now, until she found a full formula laid out across two facing pages — dense, exacting, unlike anything else in the journal."], "scene_break": false, "chapter_number": 12, "chapter_title": "The Sovereign's Diary", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"It's a synthesis,\" she said, disbelief cracking through her voice. \"It can be built. But not the way we built the blue ones.\" She traced the list of components, her expression darkening with every line. \"A whole Blue Vortex as the base. Then it lists materials I don't even recognize — isolated compounds, unstable in ways my father never would have touched. Look at this notation.\" She pointed to a symbol repeated beside three of the entries. \"That's his own warning mark. The Sovereign used my father's notation system to flag danger.\""], "scene_break": false, "chapter_number": 12, "chapter_title": "The Sovereign's Diary", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"How dangerous?\"", "\"He used the same symbol once, in the throne room notes, next to the Black Vortex reference.\" Voss's jaw tightened. \"These materials aren't just hard to source. They're actively hostile to handle. The formula practically dares whoever's reading it to try.\"", "Nathan looked at the list, then at the sealed Blue Vortex sitting safely back at the lab above.", "\"So the trade-off is real,\" he said. \"We spend the blue we just built, plus whatever these other things are, to get one red.\""], "scene_break": false, "chapter_number": 12, "chapter_title": "The Sovereign's Diary", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"That's what it says.\" Voss closed the journal carefully, staring at the cracked cover like it had just cost her something before she'd even started. \"The Sovereign never needed to gather these materials fresh every time — it had constructs, resources, time we don't have. We'd be building this from nothing, with ingredients that might be as dangerous to us as anything we've fought so far.\"", "\"Do we have a choice?\""], "scene_break": false, "chapter_number": 12, "chapter_title": "The Sovereign's Diary", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Voss looked at him for a long moment, exhaustion and grim resolve settling into place.", "\"No,\" she said. \"But we should at least know what we're about to handle before we go looking for it.\""], "scene_break": false, "chapter_number": 12, "chapter_title": "The Sovereign's Diary", "first_in_chapter": false}, {"type": "content", "paragraphs": ["The journal's list of materials read less like a shopping trip and more like a warning label, but one entry stood apart from the rest — not buried in the abyss, not sealed behind alien architecture, but marked with coordinates on the surface world. A forest, inland, far from any coastline or barricade.", "\"Wraith Hollow,\" Voss said, reading the label scrawled beside the coordinates. \"That's what he called it. Or what it was already called, and he just wrote it down.\""], "scene_break": false, "chapter_number": 12, "chapter_title": "The Sovereign's Diary", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Why would something like this be up on the surface?\" Nathan asked, staring at the map spread across the workbench. \"Everything else we've found has been down there.\"", "\"Maybe not everything came from down there originally,\" Voss said slowly. \"Maybe some of it was always here, waiting. The fracture just made it easier to find.\""], "scene_break": false, "chapter_number": 12, "chapter_title": "The Sovereign's Diary", "first_in_chapter": false}, {"type": "content", "paragraphs": ["The drive out took most of a day, the forest rising up ahead of them long before they reached its edge — dense, ancient-looking, the canopy so thick overhead that daylight barely reached the forest floor even at midday. Walker had wanted to send an escort. Voss had refused.", "\"Whatever this material does,\" she'd told him, \"I don't want more people near it than absolutely necessary.\""], "scene_break": false, "chapter_number": 12, "chapter_title": "The Sovereign's Diary", "first_in_chapter": false}, {"type": "content", "paragraphs": ["They moved through the trees on foot, scanner in hand, the readings growing steadily stronger the deeper they went, until the forest opened without warning into a small, perfectly circular clearing — unnaturally symmetrical, the trees around its edge bent subtly outward like something had pushed them back long ago and they'd simply grown that way ever since.", "At the clearing's center stood a stone pedestal, weathered but clearly ancient, and resting atop it, pulsing with a faint sickly light, was a jagged green crystal."], "scene_break": false, "chapter_number": 12, "chapter_title": "The Sovereign's Diary", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"There,\" Voss breathed, scanner readout spiking hard the moment it caught the glow.", "Nathan approached slowly, and the closer he got, the more the air itself seemed to change — a pressure behind his eyes, a tightness in his chest that had nothing to do with exertion. \"Voss. Do you feel that?\"", "\"Feel what?\"", "\"Like something's watching. Like something's about to—\" He stopped, swallowing hard, an unplaceable dread crawling up his spine with no obvious cause."], "scene_break": false, "chapter_number": 12, "chapter_title": "The Sovereign's Diary", "first_in_chapter": false}, {"type": "chapter", "number": 13, "title": "The Crystal of Fear"}, {"type": "content", "paragraphs": ["Voss checked her scanner again, and her expression shifted. \"It's not watching you. It's doing something to you. Look at this readout — it's producing some kind of field. Psychological, not physical.\"", "\"The Crystal of Fear,\" Nathan said quietly, reading the label etched faintly into the pedestal's base, worn but legible beneath centuries of grime. \"That's what it's called.\""], "scene_break": false, "chapter_number": 13, "chapter_title": "The Crystal of Fear", "first_in_chapter": true}, {"type": "content", "paragraphs": ["\"Fitting name.\" Voss circled the pedestal carefully, keeping her distance. \"The journal's notation mark makes a lot more sense now. This isn't dangerous because it'll burn you or shock you. It's dangerous because being near it long enough might make you lose your mind before you ever get the chance to carry it home.\""], "scene_break": false, "chapter_number": 13, "chapter_title": "The Crystal of Fear", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Nathan took an involuntary step back, the dread in his chest sharpening the longer he stood there, formless and creeping, like something enormous was standing just behind him no matter which way he turned.", "\"How do we even carry that back,\" he asked, \"without it doing this to us the entire way?\"", "Voss stared at the crystal, already turning the problem over.", "\"Very carefully,\" she said. \"And probably not for long.\""], "scene_break": false, "chapter_number": 13, "chapter_title": "The Crystal of Fear", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Getting the crystal back had been its own ordeal — wrapped in layers of shielded alloy mesh Voss had rushed to fabricate on-site, the dread easing the moment enough metal sat between it and bare skin, though neither of them had spoken much on the drive back, the lingering unease slow to fully shake off.", "Back in the lab, Voss set the wrapped crystal down beside the sealed Blue Vortex, both containers sitting under the same floodlights that had once illuminated every version before them."], "scene_break": false, "chapter_number": 13, "chapter_title": "The Crystal of Fear", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Alloy mesh isn't a permanent solution,\" she said, checking her notes one more time. \"It's blocking the field, not neutralizing it. The second we combine it with anything else, that containment goes away.\"", "\"So we do it fast,\" Nathan said.", "\"We do it exactly the way the journal describes,\" Voss corrected. \"No improvising this time. Whatever this thing does when combined, I don't want to find out by getting it wrong.\""], "scene_break": false, "chapter_number": 13, "chapter_title": "The Crystal of Fear", "first_in_chapter": false}, {"type": "content", "paragraphs": ["She cross-referenced the formula one final time, then carefully unwrapped the crystal just enough to expose its surface, the dread creeping back into the room the instant the mesh peeled away — fainter this time, but unmistakable, a low hum of wrongness settling behind Nathan's eyes again.", "\"Steady,\" Voss murmured, more to herself than him, opening the Blue Vortex's containment unit in the same motion."], "scene_break": false, "chapter_number": 13, "chapter_title": "The Crystal of Fear", "first_in_chapter": false}, {"type": "content", "paragraphs": ["The Blue Vortex drifted free, and the moment it neared the crystal's exposed surface, it didn't curl toward it the eager way it had toward the alloy rod, months ago. It hesitated — hovering, wary, like even the Vortex itself recognized something dangerous in what it was being asked to touch.", "\"Come on,\" Voss whispered. \"Come on—\""], "scene_break": false, "chapter_number": 13, "chapter_title": "The Crystal of Fear", "first_in_chapter": false}, {"type": "content", "paragraphs": ["The crystal pulsed, and the Blue Vortex lurched forward all at once, plunging into the green light like it had been yanked rather than drawn. The reaction was immediate and violent — the cold blue glow flooding into the crystal's jagged facets, the crystal's sickly green bleeding back into the Vortex in return, the two colors twisting and fighting for dominance in a way none of the previous merges ever had."], "scene_break": false, "chapter_number": 13, "chapter_title": "The Crystal of Fear", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"That's not stabilizing,\" Nathan said, backing away instinctively. \"Voss, that's not what the blue and throne fragments did—\"", "\"Give it a second!\" Voss didn't move, eyes locked on the reaction, scanner shaking in her grip. \"The journal said it wouldn't be clean—\""], "scene_break": false, "chapter_number": 13, "chapter_title": "The Crystal of Fear", "first_in_chapter": false}, {"type": "content", "paragraphs": ["The dread in the room spiked hard, sharp enough that Nathan's vision swam, an overwhelming, wordless panic clawing up his throat with no source he could name. He gripped the edge of the workbench, forcing himself to stay upright, to stay present, as the swirling mass of blue and green light finally began to slow, the violent churn settling into something steadier.", "When it stilled, what hovered above the workbench wasn't blue anymore. It wasn't green either."], "scene_break": false, "chapter_number": 13, "chapter_title": "The Crystal of Fear", "first_in_chapter": false}, {"type": "content", "paragraphs": ["It was a deep, pulsing crimson — heavier, darker than any Red Vortex they'd carried out of the Sovereign's clones, radiating a low, oppressive weight that pressed against the room the same way the crystal's dread had, except sharper now, more focused, like it knew exactly where to aim.", "Voss stared at it, breathless, her scanner readout climbing past every number they'd recorded from the Sovereign's own version."], "scene_break": false, "chapter_number": 13, "chapter_title": "The Crystal of Fear", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"That's not a copy,\" she said quietly. \"That's stronger. Fear given weight — a Red Vortex built on purpose instead of pulled from a well we've never seen.\" She looked at Nathan, disbelief and something like grim triumph fighting for space on her exhausted face.", "\"We just made the third piece,\" she said. \"All from scratch.\""], "scene_break": false, "chapter_number": 13, "chapter_title": "The Crystal of Fear", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Before combining the three components, Voss spread the diagram out one final time, checking every ratio, every step, against what they'd actually assembled — and that's when she noticed it. A thin slip of paper, tucked into the crease where the diagram had been folded for years, so brittle it nearly fell apart the moment she pulled it free.", "It wasn't in the Sovereign's cold script. It was Theodore's.", "\"Nathan. Look at this.\""], "scene_break": false, "chapter_number": 13, "chapter_title": "The Crystal of Fear", "first_in_chapter": false}, {"type": "content", "paragraphs": ["The handwriting was rushed, urgent, nothing like the careful notes from the rest of the lab — like it had been scrawled in a hurry and hidden rather than filed."], "scene_break": false, "chapter_number": 13, "chapter_title": "The Crystal of Fear", "first_in_chapter": false}, {"type": "chapter", "number": 14, "title": "The Light of Calming"}, {"type": "content", "paragraphs": ["\"If the Violet Vortex is ever assembled from a corrupted Red signature,\" Voss read aloud, \"it will not stabilize on its own. A negative Vortex requires a counterweight — not force, not containment, but calm. The Light of Calming: a shard of pure blue, untouched by fracture or fear, drawn only from water that has never known violence. Without it, whatever you build will collapse into something worse than what it replaced.\"", "Nathan felt his stomach drop. \"We almost combined them without it.\""], "scene_break": false, "chapter_number": 14, "chapter_title": "The Light of Calming", "first_in_chapter": true}, {"type": "content", "paragraphs": ["\"We would have,\" Voss said, staring at the note like it had just saved both their lives. \"He knew this would happen. He left the warning exactly where whoever assembled the formula would need it most.\"", "They didn't waste time deciding where to look. Voss cross-referenced global water data for the calmest, most undisturbed body of water on record — no storms, no tides worth mentioning, barely a ripple across its entire history."], "scene_break": false, "chapter_number": 14, "chapter_title": "The Light of Calming", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Lake Serenity, tucked deep in a remote, wind-sheltered valley, had never recorded a wave higher than a few inches.", "The dive down was unlike any of the others. The black water here felt different somehow — heavier with dread from everything they now carried, but the water itself was undisturbed, silent, the Devil's Light barely needing to fight for visibility the way it had everywhere else."], "scene_break": false, "chapter_number": 14, "chapter_title": "The Light of Calming", "first_in_chapter": false}, {"type": "content", "paragraphs": ["They found the ship exactly where the pattern predicted — the same rounded hull, the same jagged fins, settled into black silt with an almost peaceful stillness the other wrecks hadn't had.", "Inside, the cockpit held no formless mass this time. Instead, embedded in a small alcove near the center of the chamber, was a single shard of pale blue light — steady, gentle, radiating a calm that pressed back against the dread clinging to their gear from the crystal."], "scene_break": false, "chapter_number": 14, "chapter_title": "The Light of Calming", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"That's it,\" Voss breathed, reaching for it carefully. \"The Light of Calming.\"", "It came free without resistance, settling into her palm like it had been waiting, its glow untouched by the fear still lingering in the edges of her vision.", "Back in the lab, they laid everything out on the workbench one final time — the White Vortex, whole and steady; the Blue-and-crystal-forged Red, dark and heavy; and the Light of Calming, small and gentle between them."], "scene_break": false, "chapter_number": 14, "chapter_title": "The Light of Calming", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"All three at once,\" Voss said, checking the diagram a final time. \"Combined together, not sequentially. That's what it calls for.\"", "\"And the light?\"", "\"Held close, the instant they merge. Not inside the reaction — beside it. A counterweight, not an ingredient.\"", "Nathan positioned himself across from her, the White and Red Vortexes hovering between them in their open containment fields.", "\"Ready?\" Voss asked.", "\"No,\" Nathan said. \"Let's do it anyway.\"", "She released both Vortexes at once."], "scene_break": false, "chapter_number": 14, "chapter_title": "The Light of Calming", "first_in_chapter": false}, {"type": "content", "paragraphs": ["White and red surged toward each other, colors bleeding and warring the way the crystal reaction had, violent and unstable, the dread in the room spiking hard as the two masses fought for dominance in the open air between them. Voss didn't hesitate — she thrust the Light of Calming directly into the heart of the collision, and the shard's gentle blue glow flared bright, steadying the chaos the instant it made contact.", "The reaction stilled.", "Then the light shone."], "scene_break": false, "chapter_number": 14, "chapter_title": "The Light of Calming", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Not the low, ambient glow of any Vortex before it — an actual burst, blinding, filling the entire lab in white-blue light so intense both of them threw an arm up, staggering back from the workbench, eyes forced shut against the brilliance."], "scene_break": false, "chapter_number": 14, "chapter_title": "The Light of Calming", "first_in_chapter": false}, {"type": "content", "paragraphs": ["When it faded, hovering where the three components had merged was something new — a deep, swirling violet, steady and calm despite the violence of its creation, pulsing with a light that felt, for the first time since any of this began, like it wasn't hungry for anything at all.", "Voss lowered her arm slowly, staring at it, disbelief and exhaustion and something close to hope all tangled together."], "scene_break": false, "chapter_number": 14, "chapter_title": "The Light of Calming", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"That's it,\" she whispered. \"That's the Violet Vortex.\" They drove the Violet Vortex out to Blackpoint Bay in a reinforced case, Voss cradling it in her lap the entire way like she was afraid it might shatter from a pothole. Walker had cleared the shoreline completely — no soldiers, no cameras, just the two of them and the black water stretching out to a horizon that had never looked more like an ending."], "scene_break": false, "chapter_number": 14, "chapter_title": "The Light of Calming", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Same as before,\" Voss said, kneeling at the water's edge, the case open, the violet glow pulsing steady and calm in her hands. \"No hesitation this time. We know what it does.\"", "She was three seconds from releasing it when the bay exploded."], "scene_break": false, "chapter_number": 14, "chapter_title": "The Light of Calming", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Not a bulge, not a slow rise — the entire surface erupted at once, black water sheeting upward in a curtain fifty feet high as something colossal tore free of the depths. It hit the air and kept rising, kept unfolding, a humanoid shape scaled up beyond anything they'd fought yet, easily the size of a building — and where its skin should have been, there was only a deep, endless black scattered with pinpoints of light, cold and distant and burning, like someone had poured the entire night sky into the shape of a man and set it walking."], "scene_break": false, "chapter_number": 14, "chapter_title": "The Light of Calming", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"That's not an Abyssal,\" Nathan breathed, staggering back from the shockwave of displaced water crashing over the shoreline. \"That's not the Sovereign either.\"", "\"It came the second it sensed the Violet Vortex,\" Voss said, scrambling backward, sealing the case shut on instinct. \"It knows what we're carrying!\""], "scene_break": false, "chapter_number": 14, "chapter_title": "The Light of Calming", "first_in_chapter": false}, {"type": "chapter", "number": 15, "title": "The Galaxy Giant"}, {"type": "content", "paragraphs": ["The galaxy-skinned giant let out a sound that wasn't a roar or a groan — a deep, resonant hum that seemed to come from everywhere at once, the stars scattered across its massive frame flaring brighter in rhythm with it, and then it moved, one impossibly long stride closing half the beach in an instant.", "\"Move!\" Voss screamed."], "scene_break": false, "chapter_number": 15, "chapter_title": "The Galaxy Giant", "first_in_chapter": true}, {"type": "content", "paragraphs": ["They broke for the truck, weapons rack thrown open before either of them had fully stopped running, harpoon launchers snatched up and loaded on pure muscle memory as the giant's shadow fell across the entire shoreline behind them.", "Nathan spun and fired first, the harpoon streaking true and burying itself deep into the creature's massive shin — and the wound simply *closed*, starlight rippling across the surface like the injury had never happened at all.", "\"It's not even slowing down!\" he shouted."], "scene_break": false, "chapter_number": 15, "chapter_title": "The Galaxy Giant", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Again! Everything we've got!\" Voss fired alongside him, harpoon after harpoon sinking into that vast, star-flecked body, every single wound sealing shut within seconds, swallowed by the same endless dark that made up the rest of it."], "scene_break": false, "chapter_number": 15, "chapter_title": "The Galaxy Giant", "first_in_chapter": false}, {"type": "content", "paragraphs": ["The giant swept one massive arm sideways, and the wave of displaced air alone sent them both flying, tumbling across the sand as an entire section of the old boathouse dock splintered under the blow that followed a half-second later. Nathan rolled to his feet, ears ringing, blood in his mouth, and fired again on pure reflex — another harpoon, another useless wound closing before it even finished forming."], "scene_break": false, "chapter_number": 15, "chapter_title": "The Galaxy Giant", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Nathan, it's not working!\" Voss was on her feet too, ter the moment it sensed it close enough to reach."], "scene_break": false, "chapter_number": 15, "chapter_title": "The Galaxy Giant", "first_in_chapter": false}, {"type": "content", "paragraphs": ["It didn't sink calmly the way every other Vortex had. It thrashed beneath the surface, the black water around it churning and warbling, color bleeding outward in erratic, uneven pulses — violet, then white, then a flash of something between the two, like the reaction itself couldn't decide what it wanted to be."], "scene_break": false, "chapter_number": 15, "chapter_title": "The Galaxy Giant", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Nathan scrambled back from the shoreline, watching the water convulse, the giant above him frozen mid-motion, stars flickering wildly across its massive frame as if it had felt something ripple through it from a thousand miles away.", "\"Voss!\" he shouted. \"It's not stopping—\"", "\"Let it finish!\" she yelled back, dragging herself upright, blood on her lip, eyes locked on the churning water. \"It has to finish—\""], "scene_break": false, "chapter_number": 15, "chapter_title": "The Galaxy Giant", "first_in_chapter": false}, {"type": "content", "paragraphs": ["The warbling reached a pitch that made the ground itself seem to shudder, and then, all at once, it stopped.", "Silence.", "The black didn't retreat in a slow ring this time. It didn't clear in a shallow layer, or reach out in a single violent pulse the way the third Vortex once had. It simply — ended. Every drop of black water, everywhere, in the same breathless instant, turned clear."], "scene_break": false, "chapter_number": 15, "chapter_title": "The Galaxy Giant", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Above them, the giant convulsed. The stars scattered across its massive body began to dim one by one, faster and faster, the endless dark holding it together thinning out like smoke caught in wind. It didn't fall. It didn't fight. It simply came apart, starlight and shadow scattering into nothing, drifting away in silent, weightless motes until there was nothing left standing on the shoreline at all — no crater, no wreckage, no trace it had ever been there."], "scene_break": false, "chapter_number": 15, "chapter_title": "The Galaxy Giant", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Nathan stood frozen, chest heaving, staring at the empty space where something the size of a building had existed a heartbeat earlier.", "\"Voss,\" he managed. \"Is that—\"", "His radio crackled before she could answer, and then every radio crackled, every channel at once, voices overlapping from barricades and checkpoints and cities all over the world, all of them saying some version of the same thing.", "\"The water — sir, the water's clear—\"", "\"—every reservoir, every river, it's just *water*—\""], "scene_break": false, "chapter_number": 15, "chapter_title": "The Galaxy Giant", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"—I don't— I'm looking at the ocean right now and it's blue, it's actually blue—\"", "Voss sank to her knees at the water's edge, staring at the gentle, ordinary waves lapping against the shore — waves that reflected the sky properly for the first time since any of this began, the swirling black overhead already thinning, breaking apart into real clouds drifting over a sun neither of them had seen properly in longer than either could remember."], "scene_break": false, "chapter_number": 15, "chapter_title": "The Galaxy Giant", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Nathan dropped down beside her, laughing without quite meaning to, the sound cracking somewhere between disbelief and relief.", "Walker's voice broke through the radio, and beneath the static, they could hear it — cheering, real and unrestrained, soldiers and officers and voices from every corner of a planet that had spent months bracing for the worst.", "\"It's over,\" Voss said quietly, like she still didn't quite believe the words leaving her own mouth. \"Nathan. It's actually over.\""], "scene_break": false, "chapter_number": 15, "chapter_title": "The Galaxy Giant", "first_in_chapter": false}, {"type": "content", "paragraphs": ["He looked out at the clear, ordinary water stretching to a horizon that finally looked like one again.", "\"Yeah,\" he said. \"It is.\" Six weeks later, the ocean at Blackpoint Bay looked like it belonged in a postcard."], "scene_break": false, "chapter_number": 15, "chapter_title": "The Galaxy Giant", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Nathan stood at the same stretch of shoreline where it had all nearly ended, sleeves rolled up, watching gulls wheel low over water that caught the afternoon sun in a thousand ordinary, glittering ways. No black. No swirling sky. Just blue, all the way to a horizon that stayed exactly where it was supposed to.", "\"You're staring at the water again,\" Voss said, walking up beside him with two coffees, handing one over. \"You do that a lot now.\""], "scene_break": false, "chapter_number": 15, "chapter_title": "The Galaxy Giant", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Can't help it.\" Nathan took the cup, smiling faintly. \"Feels like I still owe it an apology or something. All those months hating the sight of it.\""], "scene_break": false, "chapter_number": 15, "chapter_title": "The Galaxy Giant", "first_in_chapter": false}, {"type": "content", "paragraphs": ["Voss laughed — a real laugh, easy in a way it hadn't been in longer than either of them could remember. The lab behind them had been quiet for weeks now, the workbenches finally cleared of containment units and scorched alloy, replaced instead with ordinary equipment doing ordinary work: water quality reports, environmental surveys, the mundane business of confirming, again and again, that the planet had actually healed."], "scene_break": false, "chapter_number": 15, "chapter_title": "The Galaxy Giant", "first_in_chapter": false}, {"type": "chapter", "number": 16, "title": "After"}, {"type": "content", "paragraphs": ["\"Walker wants us at the ceremony next month,\" Voss said. \"Some kind of memorial. For the ones who didn't make it through the barricades.\"", "\"You going?\"", "\"Yeah.\" She looked out at the water, quiet for a moment. \"I think my dad would've wanted somebody to actually stand there and remember what all this cost. Not just how it ended.\""], "scene_break": false, "chapter_number": 16, "chapter_title": "After", "first_in_chapter": true}, {"type": "content", "paragraphs": ["Nathan nodded, following her gaze. \"He got to fix it, in the end. Just took six years and both of us nearly dying a dozen times to finish the job.\"", "\"He'd have liked you,\" Voss said, glancing sideways at him. \"Annoyingly persistent. Never knew when to quit.\"", "\"I learned from the best.\""], "scene_break": false, "chapter_number": 16, "chapter_title": "After", "first_in_chapter": false}, {"type": "content", "paragraphs": ["They stood there a while longer, coffee cooling, gulls crying overhead, the tide rolling in soft and unremarkable against the sand — the most ordinary sound in the world, and somehow the best one either of them had heard in a very long time.", "\"So what now?\" Nathan asked eventually. \"No more Vortexes. No more Sovereign. No more anything, actually, now that I think about it.\"", "Voss considered that, a small, genuine smile tugging at the corner of her mouth."], "scene_break": false, "chapter_number": 16, "chapter_title": "After", "first_in_chapter": false}, {"type": "content", "paragraphs": ["\"Now,\" she said, \"we get to be bored for a while. I think we've earned it.\"", "Nathan huffed a laugh, looking back out at the water — calm, blue, and entirely, wonderfully normal.", "\"Yeah,\" he said. \"I think we have.\"", "THE END"], "scene_break": false, "chapter_number": 16, "chapter_title": "After", "first_in_chapter": false}]}</script>
<script>

    }

      if(pg.first_in_chapter && i === 0){
        html += '<p class="firstp">' + buildDropCapHTML(p) + '</p>';
      } else {
        html += '<p>' + escapeAndStyle(p) + '</p>';
      }
    });
    html += '</div>';
    html += '<div class="folio-bottom">' + (idx+1) + '</div>';
    return html;
  }

  function escapeAndStyle(s){
    var div = document.createElement('div');
    div.textContent = s;
    var escaped = div.innerHTML;
    // markdown-ish: **bold** and *italic*
    escaped = escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    escaped = escaped.replace(/\*(.+?)\*/g, '<em>$1</em>');
    return escaped;
  }

  function buildDropCapHTML(rawText){
    var html = escapeAndStyle(rawText);
    var container = document.createElement('div');
    container.innerHTML = html;
    var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
    var node = walker.nextNode();
    while(node && node.textContent.length === 0){ node = walker.nextNode(); }
    if(node){
      var text = node.textContent;
      var firstChar = text.charAt(0);
      var rest = text.slice(1);
      var span = document.createElement('span');
      span.className = 'dropcap';
      span.textContent = firstChar;
      var restNode = document.createTextNode(rest);
      var parent = node.parentNode;
      parent.insertBefore(span, node);
      parent.insertBefore(restNode, node);
      parent.removeChild(node);
    }
    return container.innerHTML;
  }

  function chapterFor(idx){
    var pg = pages[idx];
    if(!pg) return 1;
    return pg.type === 'chapter' ? pg.number : (pg.chapter_number || 1);
  }

  function buildTOC(){
    tocList.innerHTML = '';
    chapters.forEach(function(ch, i){
      var btn = document.createElement('button');
      btn.className = 'toc-item';
      btn.innerHTML = '<span class="toc-num">' + String(i+1).padStart(2,'0') + '</span><span>' + ch.title + '</span>';
      btn.addEventListener('click', function(){
        tocOverlay.hidden = true;
        cover.classList.add('hide');
        showPage(ch.start, 1);
      });
      tocList.appendChild(btn);
    });
  }

  tocBtn.addEventListener('click', function(){
    tocList.querySelectorAll('.toc-item').forEach(function(el, i){
      el.classList.toggle('current', chapterFor(current) === i+1);
    });
    tocOverlay.hidden = false;
  });
  tocOverlay.addEventListener('click', function(e){
    if(e.target === tocOverlay) tocOverlay.hidden = true;
  });

  function setPageContent(el, idx){
    var inner = el.querySelector('.page-inner');
    inner.innerHTML = renderPageHTML(idx);
  }

  function updateChrome(){
    pageIndicator.textContent = (current+1) + ' / ' + total;
    progressFill.style.width = (total > 1 ? (current/(total-1))*100 : 0) + '%';
    prevBtn.disabled = (current <= 0);
    nextBtn.disabled = false; // next past last goes to end card
    updateBookmarkUI();
  }

  function showPage(idx, animateDir){
    if(idx < 0) idx = 0;
    if(idx > total) idx = total;
    if(idx === total){
      // show end card
      stage.querySelectorAll('.pageview').forEach(function(p){ p.style.visibility='hidden'; });
      endcard.hidden = false;
      current = total - 1;
      updateChrome();
      return;
    }
    endcard.hidden = true;
    stage.querySelectorAll('.pageview').forEach(function(p){ p.style.visibility='visible'; });
    current = idx;
    setPageContent(frontEl, current);
    frontEl.style.transition = 'none';
    frontEl.style.transform = 'translateX(0) rotateY(0deg)';
    frontEl.style.opacity = '1';
    updateChrome();
    saveProgress();
  }

  var ANIM_MS = 360;
  function turnTo(idx, dir){
    // dir: 1 = forward (next), -1 = backward (prev)
    if(idx < 0 || idx > total) return;
    if(idx === current && idx !== total) { return; }

    if(idx === total){
      animateOut(dir, function(){
        showPage(total, dir);
      });
      return;
    }
    if(current === total){
      // coming back from end card
      showPage(idx, dir);
      return;
    }

    // prepare back page with the new content, slide front away
    setPageContent(backEl, idx);
    backEl.style.visibility = 'visible';
    backEl.style.zIndex = '1';
    frontEl.style.zIndex = '2';
    frontEl.style.transition = 'transform ' + ANIM_MS + 'ms cubic-bezier(.4,.0,.2,1), opacity ' + ANIM_MS + 'ms ease';
    frontEl.style.transformOrigin = (dir === 1) ? 'left center' : 'right center';
    void frontEl.offsetWidth;
    frontEl.style.transform = (dir === 1 ? 'translateX(-100%)' : 'translateX(100%)') + ' rotateY(' + (dir===1?'-8deg':'8deg') + ')';
    frontEl.style.opacity = '0.4';

    setTimeout(function(){
      // swap roles
      var tmp = frontEl; frontEl = backEl; backEl = tmp;
      frontEl.style.transition = 'none';
      frontEl.style.transform = 'translateX(0) rotateY(0deg)';
      frontEl.style.opacity = '1';
      frontEl.style.zIndex = '2';
      backEl.style.zIndex = '1';
      current = idx;
      updateChrome();
      saveProgress();
    }, ANIM_MS);
  }

  function animateOut(dir, cb){
    frontEl.style.transition = 'transform ' + ANIM_MS + 'ms ease, opacity ' + ANIM_MS + 'ms ease';
    frontEl.style.transform = (dir === 1 ? 'translateX(-100%)' : 'translateX(100%)');
    frontEl.style.opacity = '0';
    setTimeout(cb, ANIM_MS);
  }

  function next(){
    if(!cover.classList.contains('hide')) return;
    if(current + 1 <= total){
      turnTo(current + 1, 1);
    }
  }
  function prev(){
    if(!cover.classList.contains('hide')) return;
    if(current - 1 >= 0 && current !== total){
      turnTo(current - 1, -1);
    } else if(current === total){
      turnTo(total - 1, -1);
    }
  }

  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);
  restartBtn.addEventListener('click', function(){
    cover.classList.remove('hide');
    endcard.hidden = true;
  });

  coverBtn.addEventListener('click', function(){
    cover.classList.remove('hide');
  });

  cover.addEventListener('click', function(e){
    e.stopPropagation();
    cover.classList.add('hide');
    showPage(0, 1);
  });

  // keyboard
  document.addEventListener('keydown', function(e){
    if(cover && !cover.classList.contains('hide')) {
      if(e.key === 'Enter' || e.key === ' '){ cover.classList.add('hide'); }
      return;
    }
    if(e.key === 'ArrowRight') next();
    if(e.key === 'ArrowLeft') prev();
  });

  // swipe / drag
  var startX = null, startY = null, dragging = false, dragDX = 0;
  function onStart(x,y){
    if(!cover.classList.contains('hide')) return;
    startX = x; startY = y; dragging = true; dragDX = 0;
  }
  function onMove(x,y){
    if(!dragging) return;
    var dx = x - startX, dy = y - startY;
    if(Math.abs(dy) > Math.abs(dx) * 1.3) return; // vertical scroll intent, ignore
    dragDX = dx;
    if(current === total) return;
    frontEl.style.transition = 'none';
    var pct = dx;
    frontEl.style.transform = 'translateX(' + pct + 'px) rotateY(' + (dx*-0.04) + 'deg)';
  }
  function onEnd(){
    if(!dragging) return;
    dragging = false;
    var threshold = Math.min(90, window.innerWidth * 0.18);
    if(current === total){
      startX=null; return;
    }
    if(dragDX <= -threshold){
      // forward
      frontEl.style.transition = '';
      next();
    } else if(dragDX >= threshold){
      prev();
    } else {
      frontEl.style.transition = 'transform 220ms ease';
      frontEl.style.transform = 'translateX(0) rotateY(0deg)';
    }
    dragDX = 0;
  }

  stage.addEventListener('touchstart', function(e){
    var t = e.touches[0];
    onStart(t.clientX, t.clientY);
  }, {passive:true});
  stage.addEventListener('touchmove', function(e){
    var t = e.touches[0];
    onMove(t.clientX, t.clientY);
  }, {passive:true});
  stage.addEventListener('touchend', onEnd, {passive:true});

  var mouseDown = false;
  stage.addEventListener('mousedown', function(e){
    mouseDown = true;
    onStart(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', function(e){
    if(!mouseDown) return;
    onMove(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', function(){
    if(!mouseDown) return;
    mouseDown = false;
    onEnd();
  });

  // tap zones on page edges (desktop/mobile fallback, avoid interfering with drag)
  stage.addEventListener('click', function(e){
    if(dragDX !== 0) return;
    if(!cover.classList.contains('hide')) return;
    if(!endcard.hidden) return;
    var rect = stage.getBoundingClientRect();
    var relX = (e.clientX - rect.left) / rect.width;
    if(relX > 0.7){ next(); }
    else if(relX < 0.3){ prev(); }
  });

  // theme toggle
  function applyTheme(t){
    if(t){ document.documentElement.setAttribute('data-theme', t); }
    else { document.documentElement.removeAttribute('data-theme'); }
  }
  themeBtn.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : (cur === 'light' ? null : 'dark');
    applyTheme(next);
    try{ localStorage.setItem('vortex-theme', next || ''); }catch(e){}
  });
  try{
    var savedTheme = localStorage.getItem('vortex-theme');
    if(savedTheme) applyTheme(savedTheme);
  }catch(e){}

  function saveProgress(){
    try{ localStorage.setItem('vortex-progress', String(current)); }catch(e){}
  }
  function loadProgress(){
    try{
      var v = localStorage.getItem('vortex-progress');
      if(v !== null){ return parseInt(v,10) || 0; }
    }catch(e){}
    return 0;
  }

  function boot(bookData){
    DATA = bookData;
    pages = DATA.entries;
    total = DATA.page_count;
    title = DATA.title;
    document.getElementById('bookTitleLabel').textContent = title;
    document.title = title;
    chapters = DATA.chapters || [];
    buildTOC();
    bookmark = loadBookmark();
    showPage(0, 1);
  }

  try{
    var raw = document.getElementById('book-data').textContent;
    var parsed = JSON.parse(raw);
    boot(parsed);
  } catch(err){
    document.querySelector('.page-inner').innerHTML = '<p>Could not load the book data.</p>';
  }

})();
</script>
